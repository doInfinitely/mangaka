# Detector training configuration
# ---------------------------------

# Model
backbone: resnet50          # resnet18 | resnet34 | resnet50
lm_model: "Qwen/Qwen2.5-0.5B"  # HuggingFace causal LM (Qwen/Qwen2.5-0.5B, 1.5B, 3B)
prefix_length: 8               # Number of visual prefix tokens for description head
max_description_length: 64     # Max tokens per description
freeze_lm_epochs: 5            # Freeze LM weights for first N epochs

# Training
epochs: 50
pretrain_epochs: 10          # Panel-only pretraining
batch_size: 16               # Per-GPU
lr: 2.0e-4
backbone_lr_scale: 0.1       # Backbone LR = lr * this
weight_decay: 0.01
warmup_epochs: 5
patience: 15

# Loss weights
bbox_weight: 1.0
type_weight: 1.0
description_weight: 0.5

# Data
retina_size: 1024
val_split: 0.15

# Training options
amp: true
clip_grad: 1.0
label_smoothing: 0.1
num_workers: 4
seed: 42

# Checkpoints
save_path: checkpoints/detector.safetensors
