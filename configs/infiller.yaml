# Infiller training configuration
# ---------------------------------

# Model
sd_model: stabilityai/stable-diffusion-2-inpainting
controlnet_model: null       # Path to pretrained ControlNet or null to train from scratch
resolution: 512              # SD resolution

# ControlNet layout conditioning
layout_channels: 8           # Channels in layout conditioning map

# Training
epochs: 100
batch_size: 4                # Per-GPU (SD is memory hungry)
lr: 1.0e-5
controlnet_lr: 1.0e-4        # ControlNet trains faster
weight_decay: 0.01
warmup_steps: 500

# SD fine-tuning strategy
freeze_sd_epochs: 20         # Freeze SD UNet, only train ControlNet initially
unfreeze_sd_lr: 1.0e-6       # LR for SD UNet after unfreezing

# Data
val_split: 0.1
num_workers: 4

# Training options
amp: true
gradient_accumulation_steps: 4
seed: 42

# Checkpoints
save_path: checkpoints/infiller/
